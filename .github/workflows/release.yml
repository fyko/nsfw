name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release_model:
    name: Add model to release
    runs-on: ubuntu-latest
    steps:
      - name: Download model
        run: gh release download v0.2.0 -R ${{ github.repository }} -p model.onnx
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: model.onnx
          body: |
            The only file in this release is the model, `model.onnx`.
            See [the documentation](https://docs.rs/nsfw) for how to use it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
